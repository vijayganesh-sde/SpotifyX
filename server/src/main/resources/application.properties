# # JWT Configuration (if needed)
# # jwt.secret=your-secret-key
# # jwt.expiration=86400000

#### Setup for PostgreSQL Database
# 1. Database Connection Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spotify_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:srvijayganesh}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Hibernate/JPA Settings
# 'update' automatically creates tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Enable Caching
spring.cache.type=${SPRING_CACHE_TYPE:simple}
# Set cache TTL (Time To Live) to 1 hour for the songs list
spring.cache.redis.time-to-live=3600000
