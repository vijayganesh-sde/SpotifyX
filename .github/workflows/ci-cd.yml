name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotifyx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Pin npm version
        run: |
          npm install --global npm@10.8.2
          npm --version

      - name: Test and package backend
        run: mvn --batch-mode --file server/pom.xml verify

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps=false

      - name: Test frontend
        working-directory: client
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"

      - name: Build frontend
        working-directory: client
        run: npm run build
        env:
          REACT_APP_API_URL: /api

      - name: Create deploy bundle
        run: |
          mkdir -p "$RUNNER_TEMP/spotifyx-release/frontend"
          cp server/target/spotifyX-1.0.0.jar "$RUNNER_TEMP/spotifyx-release/"
          cp -R client/build/. "$RUNNER_TEMP/spotifyx-release/frontend/"
          cp deploy/ec2-deploy.sh "$RUNNER_TEMP/spotifyx-release/"
          tar -czf "$RUNNER_TEMP/spotifyx-release.tar.gz" \
            -C "$RUNNER_TEMP/spotifyx-release" .

      - name: Save deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: spotifyx-release
          path: ${{ runner.temp }}/spotifyx-release.tar.gz
          if-no-files-found: error
          retention-days: 7
