name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotifyx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Test and package backend
        run: mvn --batch-mode --file server/pom.xml verify

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Test frontend
        run: npm --prefix client test -- --watchAll=false --runInBand
        env:
          CI: "true"

      - name: Build frontend
        run: npm --prefix client run build
        env:
          REACT_APP_API_URL: /api

      - name: Create deploy bundle
        run: |
          mkdir -p "$RUNNER_TEMP/spotifyx-release/frontend"
          cp server/target/spotifyX-1.0.0.jar "$RUNNER_TEMP/spotifyx-release/"
          cp -R client/build/. "$RUNNER_TEMP/spotifyx-release/frontend/"
          cp deploy/ec2-deploy.sh "$RUNNER_TEMP/spotifyx-release/"
          tar -czf "$RUNNER_TEMP/spotifyx-release.tar.gz" \
            -C "$RUNNER_TEMP/spotifyx-release" .

      - name: Save deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: spotifyx-release
          path: ${{ runner.temp }}/spotifyx-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: spotifyx-release
          path: release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release to private S3
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set the AWS_REGION production environment variable}"
          : "${DEPLOY_BUCKET:?Set the DEPLOY_BUCKET production environment variable}"
          aws s3 cp release/spotifyx-release.tar.gz \
            "s3://${DEPLOY_BUCKET}/spotifyx/releases/${GITHUB_SHA}/release.tar.gz"

      - name: Deploy through Systems Manager
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          : "${DEPLOY_BUCKET:?Set the DEPLOY_BUCKET production environment variable}"
          : "${EC2_INSTANCE_ID:?Set the EC2_INSTANCE_ID production environment variable}"

          parameters="$(
            DEPLOY_BUCKET="$DEPLOY_BUCKET" RELEASE_SHA="$GITHUB_SHA" python3 - <<'PY'
          import json
          import os
          import re

          bucket = os.environ["DEPLOY_BUCKET"]
          release = os.environ["RELEASE_SHA"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]", bucket):
              raise SystemExit("DEPLOY_BUCKET is not a valid S3 bucket name")
          if not re.fullmatch(r"[0-9a-f]{40}", release):
              raise SystemExit("Unexpected release identifier")

          script = f"""set -euo pipefail
          archive="$(mktemp /tmp/spotifyx-release.XXXXXX.tar.gz)"
          staging="$(mktemp -d /tmp/spotifyx-release.XXXXXX)"
          trap 'rm -rf "$archive" "$staging"' EXIT
          aws s3 cp "s3://{bucket}/spotifyx/releases/{release}/release.tar.gz" "$archive"
          tar -xzf "$archive" -C "$staging"
          bash "$staging/deploy-ec2.sh" "$staging"
          """
          print(json.dumps({"commands": [script]}))
          PY
          )"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "SpotifyX ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output text
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for the EC2 deployment command."
          exit 1
